name: Build Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # `npm install` (not `npm ci`): the lockfile is generated on macOS and,
      # due to npm/cli#4828, omits the linux-x64 rollup optional binary. `npm install`
      # reads the committed lock and resolves the platform-appropriate binary on the runner.
      - run: npm install --no-audit --no-fund
      - run: npm run check

  # Builds the production image on the runner and pushes it to GHCR, so the
  # server only pulls it. Runs after the checks, and only for pushes to main.
  images:
    name: images (GHCR)
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Commit tag
        run: echo "TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The server is amd64. No provenance or SBOM: each would be one more
      # untagged package version counted against the storage.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ghcr.io/zerox9dev/logr:${{ env.TAG }}
          labels: org.opencontainers.image.source=https://github.com/zerox9dev/logr
          cache-from: type=gha,scope=logr
          cache-to: type=gha,scope=logr,mode=max
      # --prefer-index=false copies the manifest as it is instead of wrapping
      # it in an index, so the tag adds no package version.
      - name: Move main to this commit
        run: |
          docker buildx imagetools create --prefer-index=false \
            -t ghcr.io/zerox9dev/logr:main \
            ghcr.io/zerox9dev/logr:${{ env.TAG }}
      # Ten versions is ten deploys to roll back to; older ones are rebuilt
      # from their commit.
      - name: Keep the last ten versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: logr
          package-type: container
          min-versions-to-keep: 10
