name: Build Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # `npm install` (not `npm ci`): the lockfile is generated on macOS and,
      # due to npm/cli#4828, omits the linux-x64 rollup optional binary. `npm install`
      # reads the committed lock and resolves the platform-appropriate binary on the runner.
      - run: npm install --no-audit --no-fund
      - run: npm run check

  # Builds the production image on the runner and pushes it to GHCR, so the
  # server only pulls it. Runs after the checks, and only for pushes to main.
  images:
    name: images (GHCR)
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # One run at a time, and never cancel a run mid-push: a cancelled run could
    # leave :main on an older commit than the newest push.
    concurrency:
      group: images-main
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Commit tag
        run: echo "TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The server is amd64. No provenance or SBOM: each would be one more
      # untagged package version counted against the storage.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ghcr.io/zerox9dev/logr:${{ env.TAG }}
          labels: org.opencontainers.image.source=https://github.com/zerox9dev/logr
          cache-from: type=gha,scope=logr
          cache-to: type=gha,scope=logr,mode=max
      # --prefer-index=false copies the manifest as it is instead of wrapping
      # it in an index, so the tag adds no package version.
      - name: Move main to this commit
        run: |
          docker buildx imagetools create --prefer-index=false \
            -t ghcr.io/zerox9dev/logr:main \
            ghcr.io/zerox9dev/logr:${{ env.TAG }}
      # PocketBase changes only with pocketbase/Dockerfile, so its tag is the
      # version and is pushed once: an existing tag is never rebuilt, which keeps
      # the running database on exactly the image it was started with.
      - name: PocketBase version
        id: pb
        run: |
          v=$(sed -n 's/^ARG PB_VERSION=//p' pocketbase/Dockerfile)
          echo "image=ghcr.io/zerox9dev/logr-pocketbase:$v" >> "$GITHUB_OUTPUT"
          if docker buildx imagetools inspect "ghcr.io/zerox9dev/logr-pocketbase:$v" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        if: steps.pb.outputs.exists != 'true'
        with:
          context: pocketbase
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.pb.outputs.image }}
          labels: org.opencontainers.image.source=https://github.com/zerox9dev/logr
      # Ten versions is ten deploys to roll back to; older ones are rebuilt
      # from their commit. Non-fatal: the image is already pushed, and a 403
      # on a personal-account package must not turn the whole run red.
      - name: Keep the last ten versions
        uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          package-name: logr
          package-type: container
          min-versions-to-keep: 10

  # Asks Openship to deploy once this commit's images are on GHCR. Openship's own
  # deploy-on-push is off for this project: it fired before the images existed
  # and pulled the previous :main. The trigger is an incoming webhook of the
  # project in the Openship app (action "deploy", token auth). With the URL or
  # token secret missing the job only leaves a notice; deploy from Openship then.
  deploy:
    name: deploy (Openship)
    needs: [images]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Deploys queue rather than cancel: a cancelled one can leave a service
    # half replaced.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      OPENSHIP_DEPLOY_HOOK_URL: ${{ secrets.OPENSHIP_DEPLOY_HOOK_URL }}
      OPENSHIP_DEPLOY_HOOK_TOKEN: ${{ secrets.OPENSHIP_DEPLOY_HOOK_TOKEN }}
    steps:
      - name: Ask Openship to deploy
        run: |
          if [ -z "$OPENSHIP_DEPLOY_HOOK_URL" ] || [ -z "$OPENSHIP_DEPLOY_HOOK_TOKEN" ]; then
            echo "::notice::OPENSHIP_DEPLOY_HOOK_URL or OPENSHIP_DEPLOY_HOOK_TOKEN is not set, so CI does not deploy. Deploy from the Openship app."
            exit 0
          fi
          # The response names the deployment it started; the token is never printed.
          # Openship runs on the owner's MacBook: when it is off the call fails and
          # this job goes red, which is the signal to deploy by hand later.
          curl --silent --show-error --fail-with-body --max-time 60 --retry 3 --retry-all-errors \
            -X POST \
            -H "Authorization: Bearer $OPENSHIP_DEPLOY_HOOK_TOKEN" \
            "$OPENSHIP_DEPLOY_HOOK_URL"
          echo
