# =============================================================================
# logr — app container (bring-your-own PocketBase)
#
# This runs the logr Next.js app in Docker. The backend is your own PocketBase
# instance, reachable from this container over the network — e.g. a
# `pocketbase` service on the same Docker network. Only the server talks to it,
# so it needs no public hostname. See the "Self-host / deploy" section of the
# README for the collections to create and the API Rules to set.
#
#   cp .env.example .env     # set POCKETBASE_URL
#   docker compose up -d --build
#   open http://localhost:3000
# =============================================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Server-only: read at runtime, never baked into the client bundle.
      POCKETBASE_URL: ${POCKETBASE_URL:-http://pocketbase:8090}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      # Override the host port if 3000 is taken: APP_PORT=3001 in .env
      - "${APP_PORT:-3000}:3000"
